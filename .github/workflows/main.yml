name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen project.txt
        run: |
          python3 - <<'PY'
          import re, os
          t = open('project.txt', encoding='utf8').read()
          parts = re.split(r'^=== FILE: (.+?) ===\n', t, flags=re.M)
          for i in range(1, len(parts), 2):
              p = parts[i]
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              open(p, 'w', encoding='utf8').write(parts[i+1])
          PY
          find . -name '*.java' | head -20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: autobuild-mod
          path: build/libs/*.jar
